{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoguessr</title>

    <link href="{% static 'css/leaflet/leaflet.css' %}" rel="stylesheet">
    <script src="{% static 'js/leaflet/leaflet.js' %}" type="text/javascript"></script>

    <style>
        html, body {
            margin: 0;
            border: 0;
            padding: 0;
        }

        .wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mapid, #photo {
            width: 40vw;
            height: 40vh;
        }

        #photo img {
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="photo">
            <img src="/photo_cdn/{{ photo.photo_hash }}/{{ photo.path }}/" alt="">
        </div>
        <div id="mapid"></div>
    </div>

    <script>
        var map = L.map('mapid').setView([43.6425662, -79.3870568], 10);

        var actll = [{{ photo.lat }}, {{ photo.lon }}];

        var greenIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
      
        L.tileLayer( 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 28,
            tileSize: 256,
        }).addTo(map);

        map.on('click', function(e){
            var mguess = L.marker(e.latlng).addTo(map);
            var mactual = L.marker(actll, {icon: greenIcon}).addTo(map);

            var line = L.polyline([e.latlng, actll], { color: 'red' }).addTo(map);

            var dist = map.distance(e.latlng, actll);
            
            if (dist < 1000) {
                alert(`Your guess was ${Math.round(dist)} meter(s) away!`);
            } else {
                alert(`Your guess was ${Math.round(dist / 10) / 100} kilometer(s) away!`);
            }
        });
    </script>
</body>
</html>
