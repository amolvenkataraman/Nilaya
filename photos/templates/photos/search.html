{% extends "photos/photos_base.html" %}

{% block page_title %} Search {% endblock %}

{% block page_body %}
<div class="search-container">
    <div class="dashboard-title" style="margin-bottom: 24px;">🔍 Search Library</div>

    <div class="search-card">
        <form id="search-photos-form" method="GET" action="{% url 'photos' %}">
            <div class="search-grid-form">
                <div class="search-field-group">
                    <label for="filter-camera-make-input" class="search-field-label">Camera Make</label>
                    <input type="text" name="camera_make" id="filter-camera-make-input" class="search-field-input" placeholder="e.g., Apple, Canon, Sony">
                </div>
                <div class="search-field-group">
                    <label for="filter-country-input" class="search-field-label">Country</label>
                    <input type="text" name="country" id="filter-country-input" class="search-field-input" placeholder="e.g., Canada, United States">
                </div>
                <div class="search-field-group">
                    <label for="filter-city-input" class="search-field-label">City</label>
                    <input type="text" name="city" id="filter-city-input" class="search-field-input" placeholder="e.g., Toronto, Paris">
                </div>
                <div class="search-field-group">
                    <label for="filter-objects-input" class="search-field-label">Objects</label>
                    <input type="text" name="objects" id="filter-objects-input" class="search-field-input" placeholder="e.g., person, dog, car">
                </div>
            </div>
            <button type="submit" id="search-submit-btn" class="search-submit-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Search
            </button>
        </form>
    </div>

    <div class="browse-grid">
        <a href="{% url 'search_category' 'objects' %}" id="browse-objects-card" class="browse-card" style="padding: 16px; align-items: center; justify-content: center; text-align: center;">
            <div class="browse-card-icon" style="margin-bottom: 4px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
            </div>
            <div class="browse-card-title">Browse Objects</div>
        </a>

        <a href="{% url 'search_category' 'cameras' %}" id="browse-cameras-card" class="browse-card" style="padding: 16px; align-items: center; justify-content: center; text-align: center;">
            <div class="browse-card-icon" style="margin-bottom: 4px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </div>
            <div class="browse-card-title">Browse Cameras</div>
        </a>

        <a href="{% url 'search_category' 'countries' %}" id="browse-countries-card" class="browse-card" style="padding: 16px; align-items: center; justify-content: center; text-align: center;">
            <div class="browse-card-icon" style="margin-bottom: 4px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                </svg>
            </div>
            <div class="browse-card-title">Browse Countries</div>
        </a>

        <a href="{% url 'search_category' 'cities' %}" id="browse-cities-card" class="browse-card" style="padding: 16px; align-items: center; justify-content: center; text-align: center;">
            <div class="browse-card-icon" style="margin-bottom: 4px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </div>
            <div class="browse-card-title">Browse Cities</div>
        </a>
    </div>
</div>
{% endblock %}
