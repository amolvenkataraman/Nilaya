{% extends "base.html" %}

{% load static %}

{% block page_title %} View Photo {% endblock %}

{% block page_styles %}
<link href="{% static 'photo/view-photo.css' %}" rel="stylesheet">
{% endblock page_styles %}

{% block page_script %}
<script src="{% static 'photo/view-photo.js' %}" defer></script>
{% endblock %}

{% block page_body %}
<div id="photo-display-area" data-video="{{ video|yesno:'1,' }}" data-src="{{ img_path }}">
    <div id="photo"></div>
</div>
{% endblock %}
