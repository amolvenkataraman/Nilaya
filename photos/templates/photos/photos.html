{% extends "base.html" %}

{% load static %}

{% block page_title %} Photos {% endblock %}

{% block page_styles %}
<link href="{% static 'photo/styles.css' %}" rel="stylesheet" media="all"/>
<link href="{% static 'css/leaflet/leaflet.css' %}" rel="stylesheet">
{% endblock page_styles %}

{% block page_script %}
<script src="{% static 'js/moment/moment.min.js' %}" type="text/javascript"></script>
<script src="{% static 'js/leaflet/leaflet.js' %}" type="text/javascript"></script>
<script src="{% static 'js/jquery/jquery.min.js' %}" type="text/javascript"></script>
<script src="{% static 'js/handlebars/handlebars.js' %}" type="text/javascript"></script>

<style>
    .img-selected {
        outline: 5px solid blue;
        outline-offset: -5px;
    }
</style>

<script id="photo-in-list" type="text/x-handlebars-template">
    {% verbatim %}
    <div class="photo">
        <img src="{{ thumbnail }}" data-id="{{ id }}" data-url="{{ url }}" data-video="{{ video }}" class="list-img" style='display: block; float: left; margin: 2px;' onclick="event.shiftKey ? select_photo(this) : view_image(this)" height="200px">
    </div>
    {% endverbatim %}
</script>

<script id="photo-description" type="text/x-handlebars-template">
    {% verbatim %}
    <div class="photo-description">
        {{ id }}
        <div class="photo-name">
            <b>{{ filepath }}</b>
        </div>
        <br><br>
        <div class="photo-dims">
            <b>Dimensions:</b> {{ width }}x{{ height }}
        </div>
        <!--<div class="photo-posn">
            <b>Location</b>: {{ lat }}, {{ lon }}
        </div>-->
        <div class="photo-date">
            {{ date_taken }}
        </div>
        <br><br>
        <div class="camera-info">
            <span class="camera-info-header">Camera Info</span><br>
            <b>Camera Make:</b> {{ camera_make }}<br>
            <b>Camera Model:</b> {{ camera_model }}<br>
            <b>Exposure:</b> {{ exposure }}<br>
            <b>F Number:</b> {{ fnumber }}<br>
            <b>ISO Speed:</b> {{ isospeed }}<br>
            <b>Shutter Speed:</b> {{ shutterspeed }}<br>
            <b>Aperture:</b> {{ aperture }}<br>
            <b>Flash:</b> {{ flash }}<br>
            <b>Focal Length:</b> {{ focallength }}<br>
        </div>

        <button onclick="load_map({{ lat }}, {{ lon }})">Load Map</button>
        <button onclick="del_photo('{{ id }}')">Delete</button>
        <div id="mapid"></div>
    </div>
    {% endverbatim %}
</script>

<script>
    const photo_in_list = Handlebars.compile(document.querySelector("#photo-in-list").innerHTML)
    const photo_description = Handlebars.compile(document.querySelector("#photo-description").innerHTML)

    var currdate = new Date('{{ newest }}');
    const forward = '{{ forward }}' === 'True';
    var currimage;
    var imgloaded = false;
    var dates = [];

    function view_image(e) {
        if (e.shiftKey) {
            alert("test");
        }

        imgloaded = true;
        currimage = e;
        document.getElementById("photo-display-area").style.visibility = "visible";
        if (e.dataset.video == "true") {
            vid = document.createElement("video");
            src = document.createElement('source');

            src.src = e.dataset.url;
            src.type = "video/mp4"
            vid.appendChild(src)
            vid.classList.add("image-displayed");
            vid.controls = true;
            vid.loop = true;

            document.getElementById("photo").innerHTML = "";
            document.getElementById("photo").appendChild(vid);
            vid.play()
        } else {
            img = document.createElement("img");
            img.src = e.dataset.url;
            img.classList.add("image-displayed");

            document.getElementById("photo").innerHTML = "";
            document.getElementById("photo").appendChild(img);
        }

        document.querySelector(".photo-info").innerHTML = "";

        var r = new XMLHttpRequest()
        r.open("GET", `/photos/photo/${e.dataset.id}/info/`)
        r.onload = () => {
            pres = JSON.parse(r.responseText)
            try {
                pres['date_taken'] = moment(pres['date_taken']).format('lll');
                document.querySelector(".photo-info").innerHTML = photo_description(pres);
            }
            catch {}
        }
        r.send();
    }

    function select_photo(e) {
        e.classList.toggle("img-selected");
    }

    function load_map(lat, lng) {
        var map = L.map('mapid').setView([lat, lng], 12);

        L.tileLayer( 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 28,
            tileSize: 256,
        }).addTo(map);
        L.marker([lat, lng]).addTo(map)
    }

    function close_image() {
        imgloaded = false;
        document.getElementById("photo-display-area").style.visibility = "hidden";
        document.getElementById("photo").innerHTML = "";
    }

    function prev_image() {
        if (imgloaded) {
            ni = currimage.parentElement.previousElementSibling;
            if (ni != null) {
                view_image(ni.querySelector('img'));
            }
        }
    }

    function next_image() {
        if (imgloaded) {
            ni = currimage.parentElement.nextElementSibling;
            if (ni != null) {
                view_image(ni.querySelector('img'));
            }
        }
    }

    function del_photo(p) {
        var r = new XMLHttpRequest()
        r.open("POST", `/photos/delete/${p}/`)
        r.setRequestHeader("X-CSRFToken", "{{ csrf_token }}");
        r.onload = () => {}
        r.send();
    }

    function get_photos_for_date(date, next=0) {
        var date1 = moment(date).format('YYYY-MM-DD')

        if (dates.includes(date1)) { return; }
        dates.push(date1);

        document.querySelector(".photos").innerHTML += `<span class="day-label day-label-${date1}">${date1} - ${moment(date).format('dddd')}</span><div class="day-photos day-photos-${date1}"></div>`

        var r = new XMLHttpRequest();
        {% if not bounds %}
        bounds = ""
        {% else %}
        bounds = `&north={{ bounds.north }}&south={{ bounds.south }}&east={{ bounds.east }}&west={{ bounds.west }}`
        {% endif %}

        if (forward) { r.open("GET", `{% url 'get_photos_for_date' %}?date=${date1}&forward=1${bounds}`) }
        else { r.open("GET", `{% url 'get_photos_for_date' %}?date=${date1}${bounds}`) }
        r.onload = () => {
            res = JSON.parse(r.responseText)
            currdate = res['next']

            if (res["photos"].length != 0) {
                for (i = 0; i < res["photos"].length; i++) {
                    photo = res["photos"][i]
                    document.querySelector(`.day-photos-${date1}`).innerHTML += photo_in_list({"thumbnail": `/private/${photo['thumbnail_hash']}/photo_cache/thumbnail/${photo['id']}.jpg`, "url": `/photo_cdn/${photo['photo_hash']}/${photo['path']}`, "id": photo['id'], "video": photo["video"]})
                }

                document.querySelector(`.day-label-${date1}`).innerHTML += ` [${res["photos"].length}]`
            }

            if (next > 0) {
                get_photos_for_date(res['next'], next - 1)
            }
        }
        r.send()
    }

    function ingest_photos() {
        var r = new XMLHttpRequest();
        r.open("GET", `{% url 'ingest_photos' %}`)
        r.onload = () => {
            res = JSON.parse(r.responseText);
            if (res['status'] == 'success') {
                location.reload();
            }
            else {
                alert(res['data']);
            }
        }
        r.send();
        document.querySelector('.main-content').innerHTML += `
            <div style="position: absolute; left: calc(50% - 200px); top: calc(50% - 200px); width: 400px; height: 400px; z-index=1000; background-color: #ecf0f1; padding: 30px; border-radius: 15px; box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.5);">
                <span style="font-size: 1.5em; font-weight: bold;">Please Wait</span></br></br>
                <span style="font-size: 1em;">Photos ingest is running. This page will automatically refresh once it is done</span><br>
                <div class="spinner-container">
                    <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>	
                    </div>
                </div>
            </div>`
    }

    window.addEventListener('DOMContentLoaded', (event) => {
        get_photos_for_date(currdate, 4)
        
        document.onkeydown = function (e) {
            if (e.key == 'Escape') {
                close_image();
            }
            
            else if (e.key == 'ArrowLeft') {
                prev_image();
            }
            
            else if (e.key == 'ArrowRight') {
                next_image();
            }

            else if (e.key == 'Delete') {
                document.querySelectorAll(".img-selected").forEach(img => {
                    del_photo(img.dataset.id);
                    img.parentElement.remove();
                })
            }
        }

        document.querySelector(".main-content").addEventListener('scroll', (event) => {
            el = document.querySelector(".main-content");
            if (el.scrollHeight - el.scrollTop - el.clientHeight < 1 ) {
                get_photos_for_date(currdate)
            }
        })
    })
</script>
{% endblock %}

            Ingest
        </button>
    </li>

{% block page_body %}
<div id="photo-display-area">
    <div id="photo-area">
        <button id="exit-btn" type="button" class="photo-btn btn btn-info" onclick="close_image()">
            x
        </button>
        <button id="previous-btn" type="button" class="photo-btn btn btn-info" onclick="prev_image()">
            <svg width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-caret-left-fill" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M3.86 8.753l5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z"/>
            </svg>
        </button>

        <button id="next-btn" type="button" class="photo-btn btn btn-info" onclick="next_image()">
            <svg width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-caret-right-fill" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.14 8.753l-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
            </svg>
        </button>

        <div id="photo">

        </div>
    </div>

    <div class="photo-info">

    </div>
</div>

<div id="main-body">
    <div class="photos">

    </div>
</div>
{% endblock %}
