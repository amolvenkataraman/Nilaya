{% load static %}

<!DOCTYPE html>
<html lang="en" {% if request.user.dark_mode %}class="dark-mode"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>

    <link href="{% static 'css/leaflet/leaflet.css' %}" rel="stylesheet">
    <script src="{% static 'js/leaflet/leaflet.js' %}" type="text/javascript"></script>
    <script src="{% static 'js/heatmap/heatmap.min.js' %}" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-glass: rgba(255, 255, 255, 0.85);
            --border-glass: rgba(0, 0, 0, 0.08);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: rgba(37, 99, 235, 0.1);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0, 0, 0, 0.05);
            --border-radius: 14px;
            --border-radius-sm: 8px;
            --font-stack: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark-mode {
            --bg-glass: rgba(30, 41, 59, 0.8);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: rgba(59, 130, 246, 0.15);
            --shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.35), 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        html, body {
            margin: 0;
            border: 0;
            padding: 0;
        }

        #mapid {
            width: 100vw;
            height: 100vh;
        }

        .overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10000;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: var(--transition);
            line-height: 1.5;
            font-family: var(--font-stack);
        }

        .overlay-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-stack);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
        }

        .view-photos-btn {
            background: var(--accent);
            color: #ffffff;
        }

        .view-photos-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .view-photos-btn:active {
            transform: translateY(0);
        }

        .upload-gpx-btn {
            background: transparent;
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
        }

        .upload-gpx-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .upload-gpx-btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="mapid"></div>
    <div class="overlay">
        <button class="overlay-btn view-photos-btn show-photos-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            View Photos
        </button>
        <button class="overlay-btn upload-gpx-btn" onclick="document.getElementById('inputfile').click();">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            Upload GPX
        </button>
        <input type="file" name="inputfile" id="inputfile" multiple="multiple" style="display: none;">
    </div>

    <script>
        var map = L.map('mapid').setView([43.6425662, -79.3870568], 10);
        COLOR = 'blue';
      
        L.tileLayer( 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 28,
            tileSize: 256,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        {% if new_format %}
        let parsedJSON = JSON.parse('{{ coords }}');
        let pj1 = []
        for (c of parsedJSON) {
            if (c[0] != 0 && c[1] != 0) {
                pj1.push([c[0], c[1], c[2]])
            }
        }
        {% else %}
        let parsedJSON = JSON.parse('{{ coords }}');
        let pj1 = []
        for (c of parsedJSON) {
            if (c[0] != 0 && c[1] != 0) {
                pj1.push([c[0], c[1], 1])
            }
        }
        {% endif %}

        var heat = L.heatLayer(
            pj1,
            {
                minOpacity: 0.3,
                radius: 25,
                blur: 20,
                max: 1
            }
        ).addTo(map);

        document.querySelector('.show-photos-btn').onclick = function() {
            var bounds = map.getBounds();
            var n = bounds._northEast.lat.toFixed(5);
            var s = bounds._southWest.lat.toFixed(5);
            var e = bounds._northEast.lng.toFixed(5);
            var w = bounds._southWest.lng.toFixed(5);
            var b64 = btoa(`${n},${s},${e},${w}`);
            window.open(`/photos/?bounds=${b64}`, '_blank');
        }

        document.getElementById('inputfile')
        .addEventListener('change', function () {
            for (f of this.files) {
                if (f.name.includes("WALKING")) { COLOR = "green"; }
                else { COLOR = "blue" }
                let fileReader = new FileReader();
                fileReader.onload = function () {
                    new L.GPX(fileReader.result, {
                        async: true,
                        display_wpt: false,
                        marker_options: {
                            startIconUrl: null,
                            endIconUrl: null,
                            shadowUrl: null
                        },
                        polyline_options: {color: COLOR}
                    }
                    ).on('loaded', function(e) {
                        map.fitBounds(e.target.getBounds());
                    }).addTo(map);
                }
                fileReader.readAsText(f);
            }
        })
    </script>
</body>
</html>
