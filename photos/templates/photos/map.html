{% extends "photos/photos_base.html" %}

{% load static %}

{% block page_title %} Map {% endblock %}

{% block page_styles %}
{{ block.super }}
<link href="{% static 'photo/map.css' %}" rel="stylesheet" />
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/heatmap/heatmap.min.js' %}" type="text/javascript"></script>
<script src="{% static 'js/leaflet-heatmap/leaflet-heatmap.js' %}" type="text/javascript"></script>
<script src="{% static 'vendor/leaflet-heat-0.2.0/leaflet-heat.min.js' %}"></script>
<script src="{% static 'vendor/leaflet-gpx-1.7.0/gpx.min.js' %}"></script>
<script src="{% static 'photo/map.js' %}" defer></script>
{% endblock %}

{% block page_body %}
{{ coords|json_script:"map-coords" }}
<div class="ph-map-page">
    <div class="ph-page-bar">
        <h1 class="ph-page-title">Map</h1>
        <div class="ph-page-actions" role="toolbar" aria-label="Map actions">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="gpx-btn">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/></svg>
                Add GPX track
            </button>
            <button type="button" class="btn btn-sm btn-primary show-photos-btn">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/><path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z"/></svg>
                Photos in this area
            </button>
            <input type="file" id="inputfile" accept=".gpx,application/gpx+xml" multiple hidden>
        </div>
    </div>
    <div id="mapid" aria-label="Photo locations heatmap"></div>
</div>
{% endblock %}
