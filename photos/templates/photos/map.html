{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo map · AVNet Superapp</title>

    <script src="{% static 'js/theme.js' %}"></script>
    <link href="{% static 'vendor/bootstrap-5.3.3/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">

    <link href="{% static 'css/leaflet/leaflet.css' %}" rel="stylesheet">
    <script src="{% static 'js/leaflet/leaflet.js' %}" type="text/javascript"></script>
    <script src="{% static 'js/heatmap/heatmap.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'js/leaflet-heatmap/leaflet-heatmap.js' %}" type="text/javascript"></script>
    <script src="{% static 'vendor/leaflet-heat-0.2.0/leaflet-heat.min.js' %}"></script>
    <script src="{% static 'vendor/leaflet-gpx-1.7.0/gpx.min.js' %}"></script>

    <style>
        html, body {
            margin: 0;
            border: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #mapid {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--app-surface-2);
        }

        /* Floating toolbar over the map */
        .map-toolbar {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--app-surface);
            border: 1px solid var(--app-border);
            border-radius: var(--app-radius);
            box-shadow: var(--app-shadow);
        }
        .map-toolbar .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8125rem;
            font-weight: 500;
            white-space: nowrap;
        }
        .map-toolbar .btn-quiet {
            --bs-btn-color: var(--app-fg);
            --bs-btn-hover-color: var(--app-fg);
            --bs-btn-hover-bg: var(--app-overlay);
            --bs-btn-active-bg: var(--app-overlay);
            --bs-btn-border-color: transparent;
            --bs-btn-hover-border-color: transparent;
        }

        /* Leaflet chrome follows the theme; the tiles themselves stay as they are. */
        .leaflet-bar a,
        .leaflet-bar a:hover {
            background-color: var(--app-surface);
            color: var(--app-fg);
            border-bottom-color: var(--app-border);
        }
        .leaflet-bar a:hover { background-color: var(--app-surface-2); }
        .leaflet-touch .leaflet-bar,
        .leaflet-bar {
            border: 1px solid var(--app-border) !important;
            border-radius: var(--app-radius-sm);
            box-shadow: var(--app-shadow);
            overflow: hidden;
        }
        .leaflet-container .leaflet-control-attribution {
            background: color-mix(in srgb, var(--app-surface) 85%, transparent);
            color: var(--app-muted);
        }
        .leaflet-container .leaflet-control-attribution a { color: var(--app-accent); }
        .leaflet-container { font-family: var(--app-font); }

    </style>
</head>
<body>
    <div id="mapid"></div>
    <div class="map-toolbar" role="toolbar" aria-label="Map actions">
        <button type="button" class="btn btn-sm btn-quiet" onclick="document.getElementById('inputfile').click();">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/></svg>
            Upload GPX
        </button>
        <button type="button" class="btn btn-sm btn-primary show-photos-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/><path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z"/></svg>
            View photos here
        </button>
        <input type="file" name="inputfile" id="inputfile" multiple="multiple" hidden>
    </div>

    <script>
        var map = L.map('mapid').setView([43.6425662, -79.3870568], 10);
        COLOR = 'blue';
      
        L.tileLayer( 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 28,
            tileSize: 256,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        {% if new_format %}
        let parsedJSON = JSON.parse('{{ coords }}');
        let pj1 = []
        for (c of parsedJSON) {
            if (c[0] != 0 && c[1] != 0) {
                pj1.push([c[0], c[1], c[2]])
            }
        }
        {% else %}
        let parsedJSON = JSON.parse('{{ coords }}');
        let pj1 = []
        for (c of parsedJSON) {
            if (c[0] != 0 && c[1] != 0) {
                pj1.push([c[0], c[1], 1])
            }
        }
        {% endif %}

        // Rendering style is chosen via the ?style= query parameter.
        // ?style=dot restores the original per-photo dot heatmap
        // (heatmap.js / HeatmapOverlay); anything else uses the modern
        // blurred "blob" heatmap.
        var mapStyle = new URLSearchParams(window.location.search).get('style');

        if (mapStyle === 'dot') {
            var heatmapLayer = new HeatmapOverlay({
                radius: 7,
                maxOpacity: 0.9,
                scaleRadius: false,
                useLocalExtrema: true,
                latField: 'lat',
                lngField: 'lng',
                valueField: 'count'
            }).addTo(map);

            var dotData = [];
            var maxCount = 1;
            for (c of pj1) {
                dotData.push({ lat: c[0], lng: c[1], count: c[2] });
                if (c[2] > maxCount) { maxCount = c[2]; }
            }
            heatmapLayer.setData({ max: maxCount, data: dotData });
        } else {
            var heat = L.heatLayer(
                pj1,
                {
                    minOpacity: 0.3,
                    radius: 25,
                    blur: 20,
                    max: 1
                }
            ).addTo(map);
        }

        document.querySelector('.show-photos-btn').onclick = function() {
            var bounds = map.getBounds();
            var n = bounds._northEast.lat.toFixed(5);
            var s = bounds._southWest.lat.toFixed(5);
            var e = bounds._northEast.lng.toFixed(5);
            var w = bounds._southWest.lng.toFixed(5);
            var b64 = btoa(`${n},${s},${e},${w}`);
            window.open(`/photos/?bounds=${b64}`, '_blank');
        }

        document.getElementById('inputfile')
        .addEventListener('change', function () {
            for (f of this.files) {
                if (f.name.includes("WALKING")) { COLOR = "green"; }
                else { COLOR = "blue" }
                let fileReader = new FileReader();
                fileReader.onload = function () {
                    new L.GPX(fileReader.result, {
                        async: true,
                        display_wpt: false,
                        marker_options: {
                            startIconUrl: null,
                            endIconUrl: null,
                            shadowUrl: null
                        },
                        polyline_options: {color: COLOR}
                    }
                    ).on('loaded', function(e) {
                        map.fitBounds(e.target.getBounds());
                    }).addTo(map);
                }
                fileReader.readAsText(f);
            }
        })
    </script>
</body>
</html>
