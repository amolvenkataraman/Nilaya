{% extends "base.html" %}

{% load static %}

{% block page_styles %}
<link href="{% static 'photo/styles.css' %}" rel="stylesheet" media="all" />
<link href="{% static 'css/leaflet/leaflet.css' %}" rel="stylesheet">
{% endblock page_styles %}

{% block page_script %}
<script src="{% static 'js/moment/moment.min.js' %}" type="text/javascript"></script>
<script src="{% static 'js/leaflet/leaflet.js' %}" type="text/javascript"></script>
<script src="{% static 'js/jquery/jquery.min.js' %}" type="text/javascript"></script>
<script src="{% static 'js/handlebars/handlebars.js' %}" type="text/javascript"></script>
{% block extra_scripts %}{% endblock %}
{% endblock page_script %}

{% block left_sidebar %}
<ul class="nav">
    <li class="nav-item {% if active_page == 'photos' %}nav-item-selected{% endif %}">
        <a class="photo-page-link" href="{% url 'photos' %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="feather feather-image">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            Photos
        </a>
    </li>
    <li class="nav-item">
        <a class="photo-page-link" href="#" onclick="alert('Search feature coming soon!'); return false;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="feather feather-search">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            Search
        </a>
    </li>
    <li class="nav-item {% if active_page == 'albums' %}nav-item-selected{% endif %}">
        <a class="photo-page-link" href="{% url 'my_albums_page' %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="feather feather-folder">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            Albums
        </a>
    </li>
    <li class="nav-item">
        <a class="photo-page-link" href="/photos/map_new/" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="feather feather-map">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                <line x1="8" y1="2" x2="8" y2="18"></line>
                <line x1="16" y1="6" x2="16" y2="22"></line>
            </svg>
            Map
        </a>
    </li>
    <li class="nav-item nav-item-ingest">
        <button class="photo-page-link" onclick="ingest_photos()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="feather feather-refresh-cw">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Ingest
        </button>
    </li>
</ul>

<script>
    function ingest_photos() {
        var r = new XMLHttpRequest();
        r.open("GET", `{% url 'ingest_photos' %}`)
        r.onload = () => {
            res = JSON.parse(r.responseText);
            if (res['status'] == 'success') {
                alert("Ingest started. Please wait a while and refresh the page to see new photos.");
            }
            else {
                alert(res['data']);
            }
        }
        r.send();
    }
</script>
{% endblock %}
