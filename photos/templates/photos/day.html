{% for photo in photos %}
<div class="photo">
    <img src="/private/{{ photo.thumbnail_hash }}/photos_cache/thumbnail/{{ photo.id }}.jpg" style='display: block; float: left; margin: 2px; cursor: pointer;' onclick="window.open('/photos/view-photo/{{ photo.id }}/', '_blank')" height="200px">
</div>
{% endfor %}
