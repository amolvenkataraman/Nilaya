{% for photo in photos %}
<div class="photo-item" style="display: block; float: left; margin: 2px; position: relative; height: 200px;" onclick="window.open('/photos/view-photo/{{ photo.id }}/', '_blank')">
    <img src="/private/{{ photo.thumbnail_hash }}/photo_cache/thumbnail/{{ photo.id }}.webp" style='display: block; height: 200px; cursor: pointer;'>
    {% if photo.video %}
    <div class="play-btn-center">
        <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </div>
    {% if photo.duration_text %}
    <div class="video-duration-tag">{{ photo.duration_text }}</div>
    {% endif %}
    {% endif %}
</div>
{% endfor %}
