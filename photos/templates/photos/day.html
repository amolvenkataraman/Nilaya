{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <link href="{% static 'photo/styles.css' %}" rel="stylesheet" media="all" />
    <link href="{% static 'photo/photos_addon.css' %}" rel="stylesheet" />
    <style>
        body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .day-photos {
            margin-bottom: 0 !important;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="day-photos">
        {% for photo in photos %}
        <div class="photo-item" style="flex: {{ photo.aspect_ratio }} {{ photo.aspect_ratio }} calc(180px * {{ photo.aspect_ratio }}); height: 180px;" onclick="window.open('/photos/view-photo/{{ photo.id }}/', '_blank')">
            <img src="/private/{{ photo.thumbnail_hash }}/photo_cache/thumbnail/{{ photo.id }}.webp" class="list-img" style="cursor: pointer;">
            <div class="photo-indicators">
                {% if photo.has_raw %}
                <span class="indicator-badge badge-raw" title="RAW file present">RAW</span>
                {% endif %}
                {% if photo.has_orig %}
                <span class="indicator-badge badge-orig" title="Original file present">ORIG</span>
                {% endif %}
            </div>
            {% if photo.video %}
            <div class="play-btn-center">
                <svg viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
            {% if photo.duration_text %}
            <div class="video-duration-tag">{{ photo.duration_text }}</div>
            {% endif %}
            {% endif %}
        </div>
        {% endfor %}
        <div class="last-row-spacer"></div>
    </div>
</body>
</html>
