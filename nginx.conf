# TEMPLATE, not a live config. Copy it to the server and replace the example values:
#   app.example.com                 your hostname (server_name, twice) and the certificate folder below
#   /etc/letsencrypt/live/...       your TLS certificate paths
#   __HASH_SALT_GOES_HERE__         the contents of Comptech/salt.txt (both secure_link_secret lines)
#   /www/static/, /www/media/, /www/private/, /mnt/data/Photos/
#                                   STATIC_ROOT, MEDIA_ROOT, PRIVATE_ROOT and PHOTOS_ROOT in Comptech/settings.py
# Daphne must listen on the address proxy_pass uses (Makefile: DAPHNE_BIND, default 127.0.0.1).

events {
    worker_connections  4096;  ## Default: 1024
}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name app.example.com;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;  # many small requests per page (thumbnails, API); on nginx >= 1.25.1 you may write `http2 on;` instead
        server_name app.example.com;

        ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/app.example.com/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:...';  # Use strong ciphers
        ssl_prefer_server_ciphers on;

        client_max_body_size 10G;  # Maximum upload size
        client_body_buffer_size 100M;  # Buffer size for the client body
        sendfile on;  # Enable efficient file serving
        tcp_nopush on;  # Disable pushing of packets until necessary
        tcp_nodelay on;  # Disable the Nagle algorithm to reduce latency

        # Enable caching and optimize for file downloads
        #open_file_cache max=1000 inactive=20s;  # Cache open files for better performance
        #open_file_cache_valid 30s;  # Valid cache for 30 seconds
        #open_file_cache_min_uses 2;  # Cache files used at least 2 times
        send_timeout 60s;  # Timeout for sending responses
        keepalive_timeout 65s;  # Timeout for keeping connections open

        location / {
            proxy_pass http://127.0.0.1:8000;  # Daphne’s default port
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Compress text responses (Django already gzips its own HTML/JSON, so this mainly covers /static/).
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

        # Classic files carry a content hash in their name (collectstatic, Comptech/storage.py) and
        # the new interface's assets/ are hashed by Vite: safe to cache forever.
        location /static/ {
            alias /www/static/;
            gzip_static on;  # uses the .gz files frontend/build.sh writes next to the app's JS/CSS
            expires max;
            add_header Cache-Control "public, immutable";
        }

        # The new interface's unhashed files (theme.js, favicon): revalidate so updates show up.
        location /static/app/ {
            alias /www/static/app/;
            gzip_static on;
            add_header Cache-Control "no-cache";
        }

        location /static/app/assets/ {
            alias /www/static/app/assets/;
            gzip_static on;
            expires max;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /www/media/;
        }

        location /private/ {
            secure_link_secret __HASH_SALT_GOES_HERE__;
            if ($secure_link = "") { return 403; }

            rewrite ^ /secure_privmedia/$secure_link;
        }

        location /photo_cdn/ {
            secure_link_secret __HASH_SALT_GOES_HERE__;
            if ($secure_link = "") { return 403; }

            rewrite ^ /secure_photocdn/$secure_link;
        }

        location /secure_privmedia/ {
            internal;
            alias /www/private/;
        }

        location /secure_photocdn/ {
            internal;
            alias /mnt/data/Photos/;
        }
    }
}
