{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>

    <link href="{% static 'css/leaflet/leaflet.css' %}" rel="stylesheet">
    <script src="{% static 'js/leaflet/leaflet.js' %}"></script>
    <script src="{% static 'js/heatmap/heatmap.min.js' %}" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    
    <!-- Bootstrap CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery and Handlebars -->
    <script src="{% static 'js/jquery/jquery.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'js/handlebars/handlebars.js' %}" type="text/javascript"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        #mapid {
            width: 100%;
            height: 100%;
        }

        #sidebar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 300px;
            background: white;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }

        #sidebar-header {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #sidebar-content {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
        }

        #sidebar-footer {
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .sidebar-button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            height: 36px;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .sidebar-button:hover {
            background: #0056b3;
        }

        .button-group {
            display: flex;
            gap: 0;
        }

        .button-group .sidebar-button:first-child {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            flex: 3;
        }

        .button-group .sidebar-button:last-child {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            flex: 1;
        }

        .group-item {
            margin-bottom: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        .location-marker {
            display: flex;
            align-items: center;
            padding: 5px;
            margin: 5px 0;
            background: white;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .category-badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-left: 5px;
            background: #e9ecef;
        }

        #toggle-sidebar {
            position: absolute;
            bottom: 10px;
            left: 320px;
            z-index: 1000;
            padding: 8px;
            background: white;
            border: none;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .modal-backdrop {
            z-index: 1040;
        }
        
        .modal-content {
            z-index: 1050;
        }

        .location-actions {
            display: flex;
            gap: 5px;
            margin-left: auto;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 5px;
            font-size: 0.9em;
            color: #6c757d;
        }

        .action-btn:hover {
            color: #0056b3;
        }

        .map-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 5px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .map-control-btn {
            padding: 8px 12px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 2px;
        }

        .map-control-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
    </style>

    <!-- Handlebars Templates -->
    <script id="location-form-template" type="text/x-handlebars-template">
        {% verbatim %}
        <form id="location-form">
            <input type="hidden" name="id" value="{{id}}">
            <input type="hidden" name="latitude" value="{{latitude}}">
            <input type="hidden" name="longitude" value="{{longitude}}">
            <div class="mb-3">
                <label class="form-label">Group</label>
                <select class="form-select" name="group" required>
                    <option value="">Select group...</option>
                    {{#each groups}}
                    <option value="{{id}}" {{#if (eq ../group_id id)}}selected{{/if}}>{{name}}</option>
                    {{/each}}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" value="{{name}}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" name="category" required>
                    <option value="">Select category...</option>
                    <option value="house" {{#if (eq category "house")}}selected{{/if}}>House</option>
                    <option value="business" {{#if (eq category "business")}}selected{{/if}}>Business</option>

                    <option value="school" {{#if (eq category "school")}}selected{{/if}}>School</option>
                    <option value="university" {{#if (eq category "university")}}selected{{/if}}>University</option>

                    <option value="restaurant" {{#if (eq category "restaurant")}}selected{{/if}}>Restaurant</option>
                    <option value="shop" {{#if (eq category "shop")}}selected{{/if}}>Shop</option>
                    <option value="mall" {{#if (eq category "mall")}}selected{{/if}}>Shopping Mall</option>

                    <option value="parking" {{#if (eq category "parking")}}selected{{/if}}>Parking</option>
                    <option value="religious" {{#if (eq category "religious")}}selected{{/if}}>Religious</option>
                    <option value="hospital" {{#if (eq category "hospital")}}selected{{/if}}>Hospital</option>
                    <option value="transit" {{#if (eq category "transit")}}selected{{/if}}>Transit</option>

                    <option value="park" {{#if (eq category "park")}}selected{{/if}}>Park</option>
                    <option value="nature" {{#if (eq category "nature")}}selected{{/if}}>Nature</option>

                    <option value="other" {{#if (eq category "other")}}selected{{/if}}>Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3">{{description}}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" name="address" value="{{address}}">
            </div>
            <div class="mb-3">
                <label class="form-label">Rating</label>
                <select class="form-select" name="rating">
                    <option value="">No rating</option>
                    {{#each ratings}}
                    <option value="{{this}}" {{#if (eq ../rating this)}}selected{{/if}}>{{this}} ⭐</option>
                    {{/each}}
                </select>
            </div>
        </form>
        {% endverbatim %}
    </script>

</head>
<body>
    <div id="map-container">
        <div id="mapid"></div>
        <div class="map-controls">
            <button id="add-location-mode" class="map-control-btn" title="Click on map to add location">📍 Add Location</button>
        </div>
        <button id="toggle-sidebar">☰</button>
        <div id="sidebar">
            <div id="sidebar-header">
                <h4 style="margin: 0;">Locations</h3>
                <button id="refresh-data" class="toggle-btn">🔄</button>
            </div>
            <div id="sidebar-content">
                <!-- Groups will be loaded here dynamically -->
            </div>
            <div id="heatmap-controls" class="hidden" style="padding: 15px; border-top: 1px solid #dee2e6;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h4 style="margin: 0;">Heatmap Settings</h4>
                    <button id="reset-filters" class="toggle-btn" style="font-size: 0.8em;">Reset to Defaults</button>
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Year Range: <span id="year-value">2025</span></label><br>
                    <input type="range" id="year-filter" 
                           min="2004" max="2025" value="2025" 
                           style="width: 100%;">
                    <div style="margin-top: 5px;">
                        <label>
                            <input type="checkbox" id="year-mode">
                            Show only selected year (unchecked = up to selected year)
                        </label>
                    </div>
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Max Altitude: <span id="altitude-value">1000m</span></label><br>
                    <input type="range" id="altitude-filter" 
                           min="0" max="10000" value="1000" step="100"
                           style="width: 100%;">
                </div>
                <div>
                    <label>
                        <input type="checkbox" id="special-only">
                        Special photos only
                    </label>
                </div>
            </div>
            <div id="sidebar-footer">
                <div class="button-group">
                    <button class="sidebar-button" id="load-heatmap">Heatmap</button>
                    <button class="sidebar-button" id="customize-heatmap">⚙️</button>
                </div>
                <button class="sidebar-button" id="view-photos">View Photos</button>
            </div>
        </div>
    </div>

    <!-- Location Edit Modal -->
    <div class="modal fade" id="locationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="locationModalTitle">Edit Location</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="locationModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveLocationBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize the map
        var map = L.map('mapid').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 28,
        }).addTo(map);

        // Define category icons
        const categoryIcons = {
            'house': '🏠',
            'business': '🏢',
            'school': '🏫',
            'university': '🎓',
            'restaurant': '🍽️',
            'shop': '🏪',
            'mall': '🛍️',
            'parking': '🅿️',
            'religious': '⛪',
            'hospital': '🏥',
            'transit': '🚉',
            'park': '🌳',
            'nature': '🏞️',
            'other': '📍'
        };

        // Function to create custom icon
        function createCustomIcon(category) {
            const icon = categoryIcons[category] || categoryIcons['other'];
            return L.divIcon({
                html: `<div style="font-size: 24px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5));">${icon}</div>`,
                className: 'custom-div-icon',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        // Store markers by group ID and track add location mode
        let markersByGroup = {};
        let groupLayers = {};
        let addLocationMode = false;

        // Store groups globally
        let locationGroups = [];

        // Toggle add location mode
        document.getElementById('add-location-mode').addEventListener('click', function() {
            addLocationMode = !addLocationMode;
            this.classList.toggle('active');
            map.getContainer().style.cursor = addLocationMode ? 'crosshair' : '';
        });

        // Map click handler
        map.on('click', function(e) {
            if (addLocationMode) {
                showLocationModal({
                    id: '',
                    name: '',
                    category: '',
                    description: '',
                    address: '',
                    rating: '',
                    latitude: e.latlng.lat,
                    longitude: e.latlng.lng,
                    group_id: '',  // Add this field
                    ratings: [1, 2, 3, 4, 5]
                });
                // Automatically turn off add location mode after placing a location
                addLocationMode = false;
                document.getElementById('add-location-mode').classList.remove('active');
                map.getContainer().style.cursor = '';
            }
        });

        // Toggle sidebar
        document.getElementById('toggle-sidebar').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
            this.textContent = sidebar.classList.contains('hidden') ? '☰' : '✕';
        });

        // Fetch and display location groups
        function fetchLocationGroups() {
            fetch('/map/location-groups/')
                .then(response => response.json())
                .then(groups => {
                    locationGroups = groups;  // Store groups globally
                    const sidebarContent = document.getElementById('sidebar-content');
                    sidebarContent.innerHTML = '';

                    groups.forEach(group => {
                        const groupDiv = createGroupElement(group);
                        sidebarContent.appendChild(groupDiv);
                    });
                });
        }

        function createGroupElement(group) {
            const div = document.createElement('div');
            div.className = 'group-item';
            div.innerHTML = `
                <div class="group-header">
                    <div>
                        <strong>${group.name}</strong>
                        ${group.is_public ? '🌍' : '🔒'}
                    </div>
                    <label>
                        <input type="checkbox" data-group-id="${group.id}">
                    </label>
                </div>
                <div class="group-locations" id="group-${group.id}">
                    <!-- Locations will be loaded here -->
                </div>
            `;

            // Add event listener for checkbox
            div.querySelector('input[type="checkbox"]').addEventListener('change', function(e) {
                const isChecked = e.target.checked;
                toggleGroupVisibility(group.id, isChecked);
                
                // Only fetch locations if the group is being checked and hasn't been loaded yet
                if (isChecked && !groupLayers[group.id]) {
                    fetchLocationsForGroup(group.id);
                }
            });

            return div;
        }

        function fetchLocationsForGroup(groupId) {
            fetch(`/map/locations/?group=${groupId}`)
                .then(response => response.json())
                .then(locations => {
                    // Clear existing markers for this group
                    if (groupLayers[groupId]) {
                        map.removeLayer(groupLayers[groupId]);
                    }

                    // Create a new layer group
                    const markers = [];
                    locations.forEach(location => {
                        const marker = L.marker([location.latitude, location.longitude], {
                            icon: createCustomIcon(location.category)
                        })
                        .bindPopup(`
                            <div style="text-align: center;">
                                <div style="font-size: 24px; margin-bottom: 5px;">${categoryIcons[location.category] || categoryIcons['other']}</div>
                                <strong>${location.name}</strong><br>
                                ${location.category}<br>
                                ${location.description || ''}<br>
                                ${location.address || ''}<br>
                                ${location.rating ? '⭐'.repeat(location.rating) : ''}
                            </div>
                        `);
                        markers.push(marker);
                    });

                    groupLayers[groupId] = L.layerGroup(markers).addTo(map);
                    updateGroupLocationsDisplay(groupId, locations);
                });
        }

        function updateGroupLocationsDisplay(groupId, locations) {
            const groupDiv = document.getElementById(`group-${groupId}`);
            groupDiv.innerHTML = locations.map(location => `
                <div class="location-marker">
                    ${categoryIcons[location.category] || categoryIcons['other']} ${location.name}
                    <span class="category-badge">${location.category}</span>
                    <div class="location-actions">
                        <button class="action-btn edit-location" data-location='${JSON.stringify(location)}'>✏️</button>
                        <button class="action-btn delete-location" data-id="${location.id}">🗑️</button>
                    </div>
                </div>
            `).join('');

            // Add event listeners for edit and delete buttons
            groupDiv.querySelectorAll('.edit-location').forEach(btn => {
                btn.addEventListener('click', function() {
                    const location = JSON.parse(this.dataset.location);
                    showLocationModal(location);
                });
            });

            groupDiv.querySelectorAll('.delete-location').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (confirm('Are you sure you want to delete this location?')) {
                        deleteLocation(this.dataset.id);
                    }
                });
            });
        }

        function toggleGroupVisibility(groupId, visible) {
            if (groupLayers[groupId]) {
                if (visible) {
                    map.addLayer(groupLayers[groupId]);
                } else {
                    map.removeLayer(groupLayers[groupId]);
                }
            }
        }

        function loadHeatmap(useDefaults = true) {
            // Clear any existing heatmap layer
            if (window.currentHeatmap) {
                map.removeLayer(window.currentHeatmap);
            }

            // Build query parameters based on filter settings
            const params = new URLSearchParams();
            params.append('vals', '1');
            
            if (useDefaults) {
                params.append('alt-', '1000');
            } else {
                const yearFilter = document.getElementById('year-filter').value;
                const yearMode = document.getElementById('year-mode').checked;
                const altitudeFilter = document.getElementById('altitude-filter').value;
                const specialOnly = document.getElementById('special-only').checked;
                
                // If yearMode is true, use 'year' parameter for specific year
                // If false, use 'year-' parameter for up to that year
                if (yearMode) {
                    params.append('year', yearFilter);
                } else {
                    params.append('year-', yearFilter);
                }
                
                if (altitudeFilter === "0") {
                    params.append('alt-', 'NIL');
                } else {
                    params.append('alt-', altitudeFilter);
                }
                
                if (specialOnly) {
                    params.append('special', '1');
                }
            }

            fetch(`/photos/map/?${params.toString()}`)
                .then(response => response.json())
                .then(data => {
                    let pj1 = []
                    for (c of data['coords']) {
                        if (c[0] != 0 && c[1] != 0) {
                            pj1.push([c[0], c[1], 1])
                        }
                    }

                    window.currentHeatmap = L.heatLayer(
                        pj1,
                        {
                            minOpacity: 0.3,
                            radius: 25,
                            blur: 20,
                            max: 1
                        }
                    ).addTo(map);
                });
        }

        // Update value displays for sliders
        document.getElementById('year-filter').addEventListener('input', function() {
            document.getElementById('year-value').textContent = this.value;
        });

        document.getElementById('altitude-filter').addEventListener('input', function() {
            document.getElementById('altitude-value').textContent = 
                this.value === "0" ? "No altitude data only" : `${this.value}m`;
        });

        // Reset filters to defaults
        document.getElementById('reset-filters').addEventListener('click', function() {
            document.getElementById('year-filter').value = "2025";
            document.getElementById('year-value').textContent = "2025";
            document.getElementById('altitude-filter').value = "1000";
            document.getElementById('altitude-value').textContent = "1000m";
            document.getElementById('special-only').checked = false;
            document.getElementById('year-mode').checked = false;
            loadHeatmap(true);
        });

        // Toggle heatmap controls
        document.getElementById('customize-heatmap').addEventListener('click', function() {
            const controls = document.getElementById('heatmap-controls');
            controls.classList.toggle('hidden');
            this.textContent = controls.classList.contains('hidden') ? '⚙️' : '⚙️';
        });

        // Add event listeners for buttons
        document.getElementById('load-heatmap').addEventListener('click', function() {
            const controls = document.getElementById('heatmap-controls');
            loadHeatmap(controls.classList.contains('hidden'));
        });

        document.getElementById('view-photos').addEventListener('click', function() {
            bounds = map.getBounds()
            window.open(`/photos/?north=${bounds._northEast.lat}&south=${bounds._southWest.lat}&east=${bounds._northEast.lng}&west=${bounds._southWest.lng}`, '_blank')
        });

        // Refresh button
        document.getElementById('refresh-data').addEventListener('click', fetchLocationGroups);

        // Initial load
        fetchLocationGroups();

        // Get user's location and center map
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                map.setView([position.coords.latitude, position.coords.longitude], 13);
                // map.setView([43.6425662, -79.3870568], 10);
            });
        }

        // Handlebars helper for equality comparison
        Handlebars.registerHelper('eq', function(a, b) {
            return a === b;
        });

        const locationFormTemplate = Handlebars.compile(document.querySelector("#location-form-template").innerHTML);
        const locationModal = new bootstrap.Modal(document.getElementById('locationModal'));

        function showLocationModal(location = null) {
            const modalTitle = document.getElementById('locationModalTitle');
            const modalBody = document.getElementById('locationModalBody');
            
            modalTitle.textContent = location ? 'Edit Location' : 'Add New Location';
            
            const templateData = location || {
                id: '',
                name: '',
                category: '',
                description: '',
                address: '',
                rating: '',
                latitude: map.getCenter().lat,
                longitude: map.getCenter().lng,
                ratings: [1, 2, 3, 4, 5],
                group_id: ''  // Add default group_id
            };
            templateData.ratings = [1, 2, 3, 4, 5];
            templateData.groups = locationGroups;  // Add groups to template data
            
            modalBody.innerHTML = locationFormTemplate(templateData);
            locationModal.show();
        }

        // Save location
        document.getElementById('saveLocationBtn').addEventListener('click', function() {
            const form = document.getElementById('location-form');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            // Convert rating to number if present
            if (data.rating) {
                data.rating = parseInt(data.rating);
            }

            // Ensure group is included in the data
            if (!data.group) {
                alert('Please select a group');
                return;
            }

            const url = data.id ? `/map/locations/${data.id}/edit/` : '/map/locations/add/';
            const method = 'POST';

            alert(JSON.stringify(data))

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    ...data,
                    group_id: data.group  // Ensure group_id is properly set in the request
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    locationModal.hide();
                    fetchLocationGroups(); // Refresh the list
                } else {
                    alert('Error saving location: ' + data.message);
                }
            })
            .catch(error => {
                alert('Error saving location: ' + error);
            });
        });

        function deleteLocation(locationId) {
            fetch(`/map/locations/${locationId}/delete/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    fetchLocationGroups(); // Refresh the list
                } else {
                    alert('Error deleting location: ' + data.message);
                }
            })
            .catch(error => {
                alert('Error deleting location: ' + error);
            });
        }
    </script>
</body>
</html>
