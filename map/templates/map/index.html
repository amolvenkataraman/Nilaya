{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>

    <!-- Leaflet & Heatmap libraries -->
    <link href="{% static 'css/leaflet/leaflet.css' %}" rel="stylesheet">
    <script src="{% static 'js/leaflet/leaflet.js' %}"></script>
    <script src="{% static 'js/heatmap/heatmap.min.js' %}" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    
    <!-- Bootstrap CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery and Handlebars -->
    <script src="{% static 'js/jquery/jquery.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'js/handlebars/handlebars.js' %}" type="text/javascript"></script>

    <!-- Custom Premium Styles -->
    <link href="{% static 'map/styles.css' %}" rel="stylesheet">

    <!-- Handlebars Templates -->
    <script id="location-form-template" type="text/x-handlebars-template">
        {% verbatim %}
        <form id="location-form">
            <input type="hidden" name="id" value="{{id}}">
            <input type="hidden" name="latitude" value="{{latitude}}">
            <input type="hidden" name="longitude" value="{{longitude}}">
            
            <div class="mb-3">
                <label class="form-label">Group</label>
                <select class="form-select" name="group" required>
                    <option value="">Select group...</option>
                    {{#each groups}}
                    <option value="{{id}}" {{#if (eq ../group_id id)}}selected{{/if}}>{{name}}</option>
                    {{/each}}
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" value="{{name}}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" name="category" required>
                    <option value="">Select category...</option>
                    <option value="house" {{#if (eq category "house")}}selected{{/if}}>🏠 House</option>
                    <option value="business" {{#if (eq category "business")}}selected{{/if}}>🏢 Business</option>
                    <option value="school" {{#if (eq category "school")}}selected{{/if}}>🏫 School</option>
                    <option value="university" {{#if (eq category "university")}}selected{{/if}}>🎓 University</option>
                    <option value="restaurant" {{#if (eq category "restaurant")}}selected{{/if}}>🍽️ Restaurant</option>
                    <option value="shop" {{#if (eq category "shop")}}selected{{/if}}>🏪 Shop</option>
                    <option value="mall" {{#if (eq category "mall")}}selected{{/if}}>🛍️ Shopping Mall</option>
                    <option value="parking" {{#if (eq category "parking")}}selected{{/if}}>🅿️ Parking</option>
                    <option value="religious" {{#if (eq category "religious")}}selected{{/if}}>⛪ Religious</option>
                    <option value="hospital" {{#if (eq category "hospital")}}selected{{/if}}>🏥 Hospital</option>
                    <option value="transit" {{#if (eq category "transit")}}selected{{/if}}>🚉 Transit</option>
                    <option value="park" {{#if (eq category "park")}}selected{{/if}}>🌳 Park</option>
                    <option value="nature" {{#if (eq category "nature")}}selected{{/if}}>🏞️ Nature</option>
                    <option value="other" {{#if (eq category "other")}}selected{{/if}}>📍 Other</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3">{{description}}</textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" name="address" value="{{address}}">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Rating</label>
                <select class="form-select" name="rating">
                    <option value="">No rating</option>
                    {{#each ratings}}
                    <option value="{{this}}" {{#if (eq ../rating this)}}selected{{/if}}>{{this}} ⭐</option>
                    {{/each}}
                </select>
            </div>
        </form>
        {% endverbatim %}
    </script>
</head>
<body>
    <div id="map-container">
        <!-- Leaflet Map Mount Point -->
        <div id="mapid"></div>

        <!-- Float Map Controls -->
        <div class="map-controls">
            <div class="search-container">
                <input type="text" id="location-search" placeholder="Search for a location...">
                <div id="search-results" class="search-results hidden"></div>
            </div>
            <button id="add-location-mode" class="map-control-btn" title="Click on map to add location">📍 Add Location</button>
        </div>

        <!-- Sidebar Trigger -->
        <button id="toggle-sidebar">☰</button>

        <!-- Sidebar Panel -->
        <div id="sidebar" class="glass-panel">
            <!-- Sidebar Tab Navigation -->
            <div class="sidebar-tabs-nav">
                <button class="tab-nav-btn active" data-target="#pane-locations">📍 Locations</button>
                <button class="tab-nav-btn" data-target="#pane-heatmap">🔥 Heatmap</button>
            </div>
            
            <!-- Locations Pane -->
            <div id="pane-locations" class="sidebar-pane active">
                <div id="sidebar-header">
                    <h4>Locations</h4>
                    <div style="display: flex; gap: 8px;">
                        <button id="add-group" class="toggle-btn" title="Add New Group">➕</button>
                        <button id="refresh-data" class="toggle-btn" title="Refresh">🔄</button>
                    </div>
                </div>
                
                <div id="sidebar-content" class="pane-content">
                    <!-- Groups and locations list loaded dynamically -->
                </div>

                <div id="sidebar-footer" class="pane-footer">
                    <div class="sidebar-group" style="margin-bottom: 8px;">
                        <button class="sidebar-button w-100" id="view-photos">View Photos</button>
                    </div>
                    <div class="sidebar-group">
                        <div class="form-check" style="display: flex; align-items: center; gap: 8px; padding: 4px 0 0 0; margin: 0;">
                            <input type="checkbox" id="show-location-lists" style="width: 16px; height: 16px; margin: 0;">
                            <label for="show-location-lists" style="font-size: 0.85rem; user-select: none; cursor: pointer; color: var(--text-secondary); margin: 0;">Show location lists</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Heatmap Pane -->
            <div id="pane-heatmap" class="sidebar-pane">
                <div class="pane-header">
                    <h4>Heatmap Settings</h4>
                    <button id="reset-filters" class="toggle-btn" style="font-size: 0.75rem; width: auto; padding: 4px 8px;">Reset</button>
                </div>
                
                <div class="pane-content">
                    <div class="mb-4">
                        <label class="form-label" style="font-size: 0.85rem; font-weight: 500;">Year Range: <span id="year-value" style="font-weight: 600;">{% now "Y" %}</span></label>
                        <input type="range" id="year-filter" min="2004" max="{% now "Y" %}" value="{% now "Y" %}">
                        <div class="form-check mt-2">
                            <input type="checkbox" class="form-check-input" id="year-mode">
                            <label class="form-check-label" for="year-mode" style="font-size: 0.8rem; user-select: none;">Show only selected year</label>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label" style="font-size: 0.85rem; font-weight: 500;">Max Altitude: <span id="altitude-value" style="font-weight: 600;">1000m</span></label>
                        <input type="range" id="altitude-filter" min="0" max="10000" value="1000" step="100">
                    </div>
                    
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="special-only">
                        <label class="form-check-label" for="special-only" style="font-size: 0.85rem; user-select: none;">Special photos only</label>
                    </div>
                </div>

                <div class="pane-footer">
                    <button class="sidebar-button w-100" id="load-heatmap">Generate Heatmap</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Location Form Modal -->
    <div class="modal fade" id="locationModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="locationModalTitle">Location</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="locationModalBody">
                    <!-- Form template injected here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveLocationBtn">Save Location</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Group Modal -->
    <div class="modal fade" id="groupModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="group-form">
                        <div class="mb-3">
                            <label class="form-label">Group Name</label>
                            <input type="text" class="form-control" name="name" required placeholder="e.g. Favorite Cafes">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3" placeholder="Optional description..."></textarea>
                        </div>
                        <div class="form-check mb-2">
                            <input type="checkbox" class="form-check-input" name="is_public" id="is_public">
                            <label class="form-check-label" for="is_public" style="user-select: none;">Make this group public</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveGroupBtn">Create Group</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pass Django variables and mount scripts -->
    <script>
        window.CSRF_TOKEN = "{{ csrf_token }}";
    </script>
    <script src="{% static 'map/script.js' %}" type="text/javascript"></script>
</body>
</html>
