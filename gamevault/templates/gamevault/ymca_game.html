{% load static %}

<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.15.1/dist/phaser-arcade-physics.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" crossorigin="anonymous"></script>
</head>
<body>
    <style>
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border: 0;
        }
    </style>

    <script>
    var config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 0 }
            }
        },
        scene: {
            preload: preload,
            create: create,
            update: update,
        }
    };

    var game = new Phaser.Game(config);

    function preload ()
    {
        this.load.image('bg', `{% static 'gamevault/school.jpg' %}`);
        this.load.image('backpack', `{% static 'gamevault/backpack.png' %}`);
        this.load.image('book', `{% static 'gamevault/book.png' %}`)

        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function create ()
    {
        this.add.image(window.innerWidth / 2, window.innerHeight / 2, 'bg');

        this.student = this.physics.add.image(window.innerWidth / 2, window.innerHeight - 70, 'backpack');
        this.student.setVelocity(0, 0);
        this.student.setCollideWorldBounds(true);

        this.book = this.physics.add.image(window.innerWidth / 2, 0, 'book');
        this.book.setVelocity(0, 0);
        this.book.setCollideWorldBounds(true);

        this.score = 0;
        this.lives = 3;
        this.frame = 0;
        this.quadmesters = false;
        this.superhard = false;
        this.asynchronous = false;
        this.playable = true;

        this.scoreLabel = this.add.text(10, 10, `Score: ${this.score}, Lives: ${this.lives}`, { fontFamily: 'Arial, sans-serif, Times', fontSize: 20 });
        this.quadLabel = this.add.text(10, 30, ``, { fontFamily: 'Arial, sans-serif, Times', fontSize: 30 });
        this.hardLabel = this.add.text(10, 60, ``, { fontFamily: 'Arial, sans-serif, Times', fontSize: 30 });
        this.asyncLabel = this.add.text(10, 90, ``, { fontFamily: 'Arial, sans-serif, Times', fontSize: 30 });
    }

    function update ()
    {
        if (this.playable == true) {
            this.book.y += 5;
            if (this.quadmesters) {
                this.book.y += 5;
            }
            if (this.superhard) {
                this.book.y += 5;
            }
            this.frame += 1;

            if (this.frame > 1000) {
                if (this.frame % 1000 == 0) {
                    if (this.asynchronous == true) {
                        this.asynchronous = false;
                        this.asyncLabel.setText(``)
                    }
                    else {
                        this.asynchronous = true;
                        this.asyncLabel.setText(`Oops! It's an asynchronous work period. Your controls will be revesed.`)
                    }
                }
            }

            if (this.frame > 3000) {
                this.superhard = true;
                this.hardLabel.setText(`Oops! You have math and science in the same quadmester. It will be much harder now.`)
            }
            
            if (this.frame > 1000) {
                this.quadmesters = true;
                this.quadLabel.setText(`Oops! Quadmesters have come. The books will now fall twice as fast.`)
            }
            
            if (this.physics.collide(this.student, this.book)) {
                this.book.y = 0
                this.book.x = Math.floor(Math.random() * window.innerWidth)
                this.score += 1;
                this.scoreLabel.setText(`Score: ${this.score}, Lives: ${this.lives}`)
            }

            if (window.innerHeight - this.book.y <= 70)
            {
                this.book.y = 0
                this.book.x = Math.floor(Math.random() * window.innerWidth)
                this.lives -= 1;
                this.scoreLabel.setText(`Score: ${this.score}, Lives: ${this.lives}`)
                if (this.lives == 0) {
                    this.playable = false;
                    document.querySelector('.modal-toggle').click();
                    document.querySelector('.modal-body').innerHTML = `
                        Thank you for playing this game. Your score is <b>${this.score}</b>.
                        <br>
                        This game is meant to represent the real-world difficulties faced by people going to school right now. 
                        Quadmesters sped up the school system greatly, and asynchronous work periods make it really hard for people to work and stay motivated.
                        Sometimes, students lose the "course lottery" and have two hard subjects at the same quadmester. This makes the (already hard) quadmester system even harder
                    `;
                }
            }

            if (this.cursors.left.isDown)
            {
                if (this.asynchronous) {
                    this.student.x += window.innerWidth / 100;
                }
                else {
                    this.student.x -= window.innerWidth / 100;
                }
            }
            else if (this.cursors.right.isDown)
            {
                if (this.asynchronous) {
                    this.student.x -= window.innerWidth / 100;
                }
                else {
                    this.student.x += window.innerWidth / 100;
                }
            }
        }
    }
    </script>

    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary modal-toggle" data-bs-backdrop="static" data-bs-keyboard="false" data-bs-toggle="modal" data-bs-target="#exampleModal" style="display: none;">
    
    </button>
    
    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Game Over</h5>
                </div>
                <div class="modal-body">
                    ...
                </div>
            </div>
        </div>
    </div>

</body>
</html>
